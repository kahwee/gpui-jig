name: Library CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo fmt --check
  test:
    name: Native tests and Rust examples (${{ matrix.os }})
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo test --locked
  package:
    name: Verify registry package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: cargo publish --locked --dry-run
      - run: cargo package --locked --target-dir target --no-verify
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-jig-crate
          path: target/package/*.crate
          if-no-files-found: error
  starter:
    name: Install npm tarball and build generated Rust app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Test clean install
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          archive="$RUNNER_TEMP/gpui-jig-$(node -p "require('./package.json').version").tgz"
          npm install --prefix "$RUNNER_TEMP/consumer" "$archive" --no-audit --no-fund
          "$RUNNER_TEMP/consumer/node_modules/.bin/gpui-jig" create "$RUNNER_TEMP/example"
          cargo build --manifest-path "$RUNNER_TEMP/example/Cargo.toml" --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpui-jig-npm
          path: ${{ runner.temp }}/gpui-jig-*.tgz
          if-no-files-found: error
