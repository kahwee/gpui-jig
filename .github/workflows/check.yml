name: Library CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: library-${{ github.ref }}
  cancel-in-progress: true
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo fmt --check
  test:
    name: Native tests and Rust examples
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo test --locked
  package:
    name: Verify registry package
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - run: cargo publish --locked --dry-run
      - run: cargo package --locked --target-dir target --no-verify
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: gpui-jig-crate
          path: target/package/*.crate
          if-no-files-found: error
