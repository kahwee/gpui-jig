[package]
name = "gpui-jig"
version = "0.1.8"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
description = "Unstyled GPUI components with composable parts for Rust applications."
repository = "https://github.com/kahwee/gpui-jig"
homepage = "https://kahwee.github.io/gpui-jig/"
documentation = "https://kahwee.github.io/gpui-jig/"
keywords = ["gpui", "ui", "desktop", "components"]
categories = ["gui"]
include = ["src/**", "README.md", "LICENSE", "Cargo.toml", "Cargo.lock"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
gpui = { package = "gpui-pre", version = "0.3.10" }

